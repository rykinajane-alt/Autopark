<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Автопарк</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #273449;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #243b64;
        }

        .subtitle {
            color: #68758a;
            margin-bottom: 25px;
        }

        .top-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            min-width: 220px;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            color: #273449;
        }

        .search-input:focus,
        .sort-select:focus {
            outline: none;
            border-color: #315f9f;
        }

        .sort-select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            color: #273449;
            background: white;
        }

        button,
        .button {
            display: inline-block;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .add-button {
            background: #21864b;
        }

        .statistics-button {
            background: #315f9f;
        }

        .search-button {
            background: #315f9f;
        }

        .reset-button {
            background: #68758a;
        }

        .edit-button {
            background: #d99020;
        }

        .delete-button {
            background: #c63838;
        }

        button:hover,
        .button:hover {
            opacity: 0.88;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 6px;
            background: #e3f5e9;
            color: #176b38;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #d5deea;
            text-align: left;
        }

        th {
            background: #eaf0f8;
            color: #243b64;
        }

        tbody tr:nth-child(even) {
            background: #f7f9fc;
        }

        .actions {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .actions form {
            margin: 0;
        }

        .empty {
            text-align: center;
            color: #68758a;
            padding: 25px;
        }

        .count {
            margin-top: 15px;
            color: #68758a;
            font-size: 14px;
        }

        @media (max-width: 800px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
                overflow-x: auto;
            }

            table {
                min-width: 750px;
            }

            .search-form {
                align-items: stretch;
            }

            .search-input {
                flex-basis: 100%;
            }

            .sort-select {
                flex: 1;
                min-width: 140px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Информационная система «Автопарк»</h1>

    <p class="subtitle">
        Список автомобилей и информация о владельцах
    </p>

    <!-- Кнопки -->
    <div class="top-actions">

        <a class="button add-button"
           th:href="@{/cars/new}">
            + Добавить автомобиль
        </a>

        <a class="button statistics-button"
           th:href="@{/cars/statistics}">
            Статистика
        </a>

    </div>

    <!-- Поиск и сортировка -->
    <form class="search-form"
          th:action="@{/cars}"
          method="get">

        <input
                class="search-input"
                type="text"
                name="keyword"
                placeholder="Введите марку автомобиля"
                th:value="${keyword}">

        <select class="sort-select"
                name="sortDir">

            <option value="asc"
                    th:selected="${sortDir == 'asc'}">
                По возрастанию
            </option>

            <option value="desc"
                    th:selected="${sortDir == 'desc'}">
                По убыванию
            </option>

        </select>

        <button type="submit"
                class="search-button">
            Найти
        </button>

        <a class="button reset-button"
           th:href="@{/cars}">
            Сбросить
        </a>

    </form>

    <!-- Сообщение об успешном действии -->
    <div class="message"
         th:if="${successMessage}"
         th:text="${successMessage}">
    </div>

    <!-- Таблица автомобилей -->
    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Марка</th>
            <th>Год выпуска</th>
            <th>Дата постановки на учёт</th>
            <th>ФИО владельца</th>
            <th>Действия</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="car : ${cars}">

            <td th:text="${car.id}"></td>

            <td th:text="${car.brand}"></td>

            <td th:text="${car.year}"></td>

            <td th:text="${car.registrationDate != null
                         ? car.registrationDate
                         : '—'}">
            </td>

            <td th:text="${car.ownerFullName}"></td>

            <td>

                <div class="actions">

                    <!-- Редактирование -->
                    <a class="button edit-button"
                       th:href="@{/cars/edit/{id}(id=${car.id})}">
                        Изменить
                    </a>

                    <!-- Удаление -->
                    <form th:action="@{/cars/delete/{id}(id=${car.id})}"
                          method="post"
                          onsubmit="return confirm('Удалить этот автомобиль?');">

                        <button type="submit"
                                class="delete-button">
                            Удалить
                        </button>

                    </form>

                </div>

            </td>

        </tr>

        <!-- Если автомобилей нет -->
        <tr th:if="${#lists.isEmpty(cars)}">

            <td colspan="6"
                class="empty">
                Автомобили не найдены
            </td>

        </tr>

        </tbody>

    </table>

    <!-- Счётчик записей -->
    <p class="count">

        Количество автомобилей в таблице:

        <strong th:text="${#lists.size(cars)}">
            0
        </strong>

    </p>

</div>

</body>

</html>
