
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Автомобиль</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #273449;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #243b64;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd3df;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #315b9a;
        }

        .error {
            display: block;
            margin-top: 5px;
            color: #c23b3b;
            font-size: 13px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button, .back-button {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            color: white;
            background: #315b9a;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .back-button {
            background: #68758a;
        }

        button:hover, .back-button:hover {
            opacity: 0.88;
        }
    </style>
</head>
<body>
<div class="container">

    <h1 th:text="${pageTitle}">Автомобиль</h1>

    <form th:action="@{/cars/save}"
          th:object="${car}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="brand">Марка автомобиля</label>
            <input type="text"
                   id="brand"
                   th:field="*{brand}"
                   placeholder="Например, Toyota">
            <span class="error"
                  th:if="${#fields.hasErrors('brand')}"
                  th:errors="*{brand}"></span>
        </div>

        <div class="form-group">
            <label for="model">Модель автомобиля</label>
            <input type="text"
                   id="model"
                   th:field="*{model}"
                   placeholder="Например, Camry">
            <span class="error"
                  th:if="${#fields.hasErrors('model')}"
                  th:errors="*{model}"></span>
        </div>

        <div class="form-group">
            <label for="registrationNumber">Регистрационный номер</label>
            <input type="text"
                   id="registrationNumber"
                   th:field="*{registrationNumber}"
                   placeholder="Например, А123АА">
        </div>

        <div class="form-group">
            <label for="mileage">Пробег (км)</label>
            <input type="number"
                   id="mileage"
                   th:field="*{mileage}"
                   min="0"
                   placeholder="Введите пробег">
            <span class="error"
                  th:if="${#fields.hasErrors('mileage')}"
                  th:errors="*{mileage}"></span>
        </div>

        <div class="form-group">
            <label for="status">Статус автомобиля</label>
            <select id="status" th:field="*{status}">
                <option value="">Выберите статус</option>
                <option value="Доступен">Доступен</option>
                <option value="В рейсе">В рейсе</option>
                <option value="На обслуживании">На обслуживании</option>
            </select>
        </div>

        <div class="buttons">
            <button type="submit">Сохранить</button>
            <a class="back-button" th:href="@{/cars}">Назад</a>
        </div>

    </form>
</div>
</body>
</html>
